[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Currency trading simulator with Parser Service (MEPHI, final project)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "forgo", email = "polishtoilet@rambler.ru" },
]
dependencies = [
    "requests>=2.32.3,<3.0.0",
    "prettytable>=3.11.0,<4.0.0",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"valutatrade_hub/cli/interface.py" = ["C901"]
